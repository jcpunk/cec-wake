[project]
name = "cec-wake"
version = "0.1.0"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
description = "HDMI-CEC wake controller (systemd user service + udev rule)"
readme = "docs/README.md"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.20.0",
  "pre-commit>=4.5.1",
  "pytest>=9.0.2",
  "pytest-cov>=6.0.0",
  "ruff>=0.15.9",
]

[tool.uv.dependency-groups]
# The daemon itself supports Python >=3.9 (see requires-python above, needed
# for the zipapp to run unmodified across RHEL/AlmaLinux major versions).
# The dev tooling has no such constraint and may require newer Python; scope
# it separately so uv does not try to solve mypy/pre-commit for Python 3.9.
dev = { requires-python = ">=3.11" }

[tool.mypy]
files = "src"
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src -ra"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/**", "src/cec_wake/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 97
exclude_lines = [
  "if __name__ == .__main__.:",
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@abstractmethod",
]

[tool.ruff]
fix = true

[tool.ruff.lint]
extend-select = [
  "A",     # detect shadowed builtins
  "ARG",   # unused-arguments
  "B",     # flake8-bugbear
  "C4",    # incorrect use of comprehensions, dict, list, etc
  "COM",   # enforce trailing comma rules
  "E",     # PyCodeStyle errors
  "F",     # Pyflakes rules
  "FA",    # require `from __future__ import annotations` when needed
  "FBT",   # detect boolean traps
  "G",     # Better usage of built-in logging
  "I",     # isort - import sorting
  "ICN",   # use common import conventions
  "ISC",   # good use of string concatenation
  "N",     # enforce naming conventions
  "PL",    # pylint
  "PTH",   # use pathlib instead of os.path
  "Q",     # quoting rules
  "RET",   # good return practices
  "RUF",   # ruff specific lint rules
  "S",     # bandit
  "SIM",   # flake8-simplify
  "TID",   # tidier imports
  "TRY",   # tryceratops - exception handling
  "UP",    # pyupgrade
  "W",     # PyCodeStyle warnings
]
ignore = [
  "BLE001", # catch-and-log is intentional at connection/loop boundaries
  "COM812", # de-dupe trailing commas
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "ARG001",  # fixture args used for side-effects only are intentionally unused
  "ARG002",  # same as ARG001 for method arguments in test classes
  "ARG005",  # lambda args matching a real/mocked signature are often unused
  "E501",    # line too long -- test readability trumps line length
  "FBT003",  # booleans passed positionally mirror real DBus signal payloads
  "N818",    # local sentinel exceptions in tests need no Error suffix
  "S101",    # test cases use assert
  "PLR2004", # magic values -- expected counts are intentional literals in tests
  "PLC0415", # imports not at top level -- fixture-scoped imports are intentional
  "TRY003",  # exception messages in tests are often local
]
